<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCENDANT · CHARACTER TEST</title>
    <style>
        :root {
            --bg: #0B0B0D;
            --bg-secondary: #151519;
            --text: #F2F2F2;
            --text-muted: #92929A;
            --border: #303036;
            --accent: #4A6FA5;
            --accent-soft: rgba(74, 111, 165, 0.2);
            --transition: 0.3s ease;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 2rem;
            animation: fadeIn 0.5s ease forwards;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 시작 화면 — 표지·심볼 제거 */
        .start-screen {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .top-label {
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .main-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .description {
            max-width: 500px;
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .info-line {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        .btn {
            padding: 1rem 3rem;
            background: transparent;
            border: 1px solid var(--text);
            color: var(--text);
            font-size: 1rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all var(--transition);
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--text);
            color: var(--bg);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--text-muted);
        }
        /* 검사 화면 */
        .test-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .progress-bar-container {
            width: 100%;
            height: 3px;
            background: var(--bg-secondary);
            margin-bottom: 3rem;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-container {
            max-width: 700px;
            margin: 0 auto;
            flex: 1;
        }

        .question-number {
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .option-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1.2rem 1.5rem;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            border-radius: 2px;
            line-height: 1.6;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: rgba(74, 111, 165, 0.1);
        }

        .option-btn.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            max-width: 700px;
            margin: 0 auto;
        }

        .btn-secondary {
            border-color: var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--text);
        }

        .error-message {
            color: #E57373;
            margin-bottom: 1rem;
            text-align: center;
            min-height: 1.5rem;
        }

        /* 결과 화면 */
        .result-screen {
            align-items: center;
            text-align: center;
        }

        .result-label {
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--accent);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .result-intro {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--text-muted);
        }

        .member-name {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .member-sector {
            font-size: 1rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .member-image {
            max-width: 350px;
            width: 100%;
            border-radius: 4px;
            margin-bottom: 2rem;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .member-keywords {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .keyword {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .result-description {
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 1.9;
            color: var(--text-muted);
        }

        .result-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .screen {
                padding: 1.5rem;
            }
            .btn {
                padding: 0.9rem 2rem;
            }
            .option-btn {
                padding: 1rem 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 시작 화면 -->
    <div class="screen start-screen active" id="startScreen">
        <p class="top-label">ASCENDANT · CHARACTER TEST</p>
        <h1 class="main-title">당신은 누구와 닮아 있는가?</h1>
        <p class="description">
            당신의 선택과 판단을 바탕으로 ASCENDANT의 여섯 멤버 중<br>
            당신과 가장 닮은 유형을 찾아보세요.<br>
            15개의 문항에 답하고 나면, 당신의 성향과 가장 가까운 멤버를 확인할 수 있습니다.
        </p>
        <p class="info-line">15 QUESTIONS · 4 OPTIONS · 6 MEMBERS</p>
        <button class="btn" id="startBtn">TEST START</button>
    </div>
    <!-- 검사 화면 -->
    <div class="screen test-screen" id="testScreen">
        <div class="test-header">
            <p class="progress-text" id="progressText">01 / 15</p>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="question-container">
            <p class="question-number" id="questionNumber">QUESTION 01</p>
            <h2 class="question-text" id="questionText"></h2>
            <div class="options-container" id="optionsContainer"></div>
            <p class="error-message" id="errorMessage"></p>
        </div>
        <div class="nav-buttons">
            <button class="btn btn-secondary" id="prevBtn">이전</button>
            <button class="btn" id="nextBtn">다음</button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div class="screen result-screen" id="resultScreen">
        <p class="result-label">YOUR MATCH</p>
        <p class="result-intro" id="resultIntro">당신과 가장 닮은 멤버는</p>
        <h2 class="member-name" id="memberName"></h2>
        <p class="member-sector" id="memberSector"></p>
        <img src="" alt="" class="member-image" id="memberImage">
        <div class="member-keywords" id="memberKeywords"></div>
        <div class="result-description" id="resultDescription"></div>
        <div class="result-actions">
            <button class="btn" id="restartBtn">다시 검사하기</button>
            <button class="btn btn-secondary" id="shareBtn">결과 공유하기</button>
        </div>
    </div>

    <!-- 알림 -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== 멤버 데이터 (멤버 이미지만 사용) =====
        const members = [
            {
                id: "seo-na-u",
                name: "서나유 (Seo NA-U)",
                sector: "SECTOR 01",
                image: "img_na_u.png",
                keywords: ["#책임", "#신중", "#엄격"],
                description: `당신은 진실과 책임을 가장 먼저 생각합니다. 누군가가 숨기거나 덮으려 할 때, 오히려 사실을 드러내야 한다고 믿습니다. 쉽게 화를 내지 않지만, 옳지 않은 것을 보면 침묵하지 않습니다. 결정을 내리기 전에 여러 번 확인하고, 한번 마음을 정하면 끝까지 지켜냅니다. 차갑게 보일 수 있지만, 그것은 모두 진실을 지키기 위한 마음입니다.`,
                shortDesc: "비로소 진실을 보았습니다.",
                scores: { naU: 10, midEum: 3, simJ: 2, yuJun: 2, yeRin: 3, yunJae: 2 }
            },
            {
                id: "han-mid-eum",
                name: "한믿음 (Han MID-EUM)",
                sector: "SECTOR 01",
                image: "img_mid_eum.png",
                keywords: ["#솔직", "#자유", "#직진"],
                description: `당신은 거짓된 모습으로 살아가는 것을 견딜 수 없습니다. 지금의 질서가 잘못되었다면, 그것을 고치는 것만으로는 충분하지 않을 수도 있다고 생각합니다. 때로는 거칠게 보여도 마음은 가장 진실합니다. 사람들이 두려워하지 않고 나아갈 수 있도록 앞장서는 사람입니다. 불의를 보면 참지 않고, 변화를 위해 직접 움직입니다.`,
                shortDesc: "별똥별처럼 타고 떨어집니다.",
                scores: { naU: 3, midEum: 10, simJ: 3, yuJun: 2, yeRin: 2, yunJae: 3 }
            },
            {
                id: "sim-j",
                name: "심제이 (Sim J)",
                sector: "SECTOR 02",
                image: "img_sim_j.png",
                keywords: ["#계산", "#전략", "#판단"],
                description: `당신은 감정보다 상황을 먼저 봅니다. 무엇을 얻을 수 있고 무엇을 잃게 될지, 그것이 가장 중요합니다. 이상만 쫓지도 않고 현실에 얽매이지도 않습니다. 주어진 환경 속에서 가장 유리한 선택을 찾아내고, 위험을 피할 방법을 찾습니다. 사람들과의 관계도 목적을 위해 조율하지만, 때로는 그것이 진심으로 변하기도 합니다. 냉정해 보이지만 결코 무정하지 않습니다.`,
                shortDesc: "하늘에서 내려온 것 같습니다.",
                scores: { naU: 2, midEum: 3, simJ: 10, yuJun: 4, yeRin: 3, yunJae: 5 }
            },
            {
                id: "cha-yu-jun",
                name: "차유준 (Cha YU-JUN)",
                sector: "SECTOR 02",
                image: "img_yu_jun.png",
                keywords: ["#유연", "#적응", "#생존"],
                description: `당신은 세상이 언제든 변할 수 있다는 것을 잘 알고 있습니다. 단단한 원칙보다 살아남는 것이 우선일 때도 있습니다. 어느 편에도 너무 깊이 묶이지 않고, 상황에 맞춰 자신을 바꿀 수 있습니다. 누구와도 잘 지내고, 위기 속에서도 길을 찾아냅니다. 때로는 자신이 어떤 사람인지 흐릿해질 때도 있지만, 결국 살아남는 것이 가장 중요하다고 믿습니다.`,
                shortDesc: "아마도 영원히 그리워할 것입니다.",
                scores: { naU: 2, midEum: 2, simJ: 4, yuJun: 10, yeRin: 3, yunJae: 3 }
            },
            {
                id: "jin-ye-rin",
                name: "진예린 (Jin YE-RIN)",
                sector: "SECTOR 03",
                image: "img_ye_rin.png",
                keywords: ["#노력", "#성과", "#자립"],
                description: `당신은 말이나 배경보다 실제 결과로 자신을 증명하려 합니다. 누군가의 인정에 기대지 않고, 스스로의 힘으로 자격을 만들어냅니다. 기준이 불공평하다면 그 기준을 통과할 수 있는 실력을 키우는 것이 답이라고 생각합니다. 묵묵히 노력하고, 그 결과로 말하는 사람입니다. 때로는 주변을 돌보는 것을 잊을 수도 있지만, 그것은 모두 자신의 자리를 스스로 지키기 위한 것입니다.`,
                shortDesc: "유성처럼 땅으로 내려옵니다.",
                scores: { naU: 3, midEum: 2, simJ: 3, yuJun: 3, yeRin: 10, yunJae: 5 }
            },
            {
                id: "kang-yun-jae",
                name: "강윤재 (Kang YUN-JAE)",
                sector: "SECTOR 03",
                image: "img_yun_jae.png",
                keywords: ["#목표", "#승리", "#성장"],
                description: `당신은 더 높은 곳을 향해 나아가는 것을 멈추지 않습니다. 경쟁을 피하지 않고, 기회가 생기면 가장 먼저 손을 내밉니다. 권력과 지위는 노력해서 얻는 것이라고 믿으며, 그것을 가져야 더 많은 것을 바꿀 수 있다고 생각합니다. 때로는 주변 사람들을 밀어내고 앞으로 나아갈 수도 있지만, 그것이 살아가는 방식이라고 믿습니다. 결국 정상에 서는 것이 답입니다.`,
                shortDesc: "죽을 각오로 준비했습니다.",
                scores: { naU: 2, midEum: 3, simJ: 5, yuJun: 3, yeRin: 5, yunJae: 10 }
            }
        ];
        // ===== 문항 데이터 =====
        const questions = [
            {
                id: 1,
                text: "모두가 따르는 규칙이 누군가에게 명백히 불리하게 작용하고 있습니다. 당신은 어떻게 행동하시겠습니까?",
                options: [
                    { text: "규칙이 유지되는 데 이유가 있는지 확인합니다. 먼저 그 원인을 파악하고, 사실을 확인한 뒤 행동합니다.", scores: { naU: 1, midEum: 0, simJ: 0, yuJun: 0, yeRin: 1, yunJae: 0 } },
                    { text: "규칙 자체가 잘못되었다면 바꿔야 한다고 생각합니다. 기존의 틀을 의심하고, 근본적인 변화를 추구합니다.", scores: { naU: 0, midEum: 1, simJ: 0, yuJun: 0, yeRin: 0, yunJae: 0 } },
                    { text: "이 상황에서 내가 얻을 것과 잃을 것을 계산합니다. 개입하는 것이 유리한지 먼저 판단한 뒤 결정합니다.", scores: { naU: 0, midEum: 0, simJ: 1, yuJun: 0, yeRin: 0, yunJae: 1 } },
                    { text: "상황이 어떻게 변할지 지켜봅니다. 섣불리 편을 정하지 않고, 여러 가능성을 남겨둡니다.", scores: { naU: 0, midEum: 0, simJ: 0, yuJun: 1, yeRin: 0, yunJae: 0 } }
                ]
            },
            {
                id: 2,
                text: "다른 사람보다 더 많은 기회를 얻기 위해 아직 공개되지 않은 정보를 먼저 알 수 있는 방법이 있습니다. 하지만 그 과정은 권장되지 않습니다. 당신은 어떻게 하시겠습니까?",
                options: [
                    { text: "정보의 출처와 진실성을 먼저 확인합니다. 부당한 방법으로 얻은 것은 결국 문제가 된다고 생각합니다.", scores: { naU: 1, midEum: 0, simJ: 0, yuJun: 0, yeRin: 1, yunJae: 0 } },
                    { text: "시스템 자체가 불공평하다면, 그 틀을 따를 필요는 없다고 생각합니다. 진실을 밝힐 수 있다면 방법이 중요하지 않을 수도 있습니다.", scores: { naU: 0, midEum: 1, simJ: 0, yuJun: 0, yeRin: 0, yunJae: 0 } },
                    { text: "얻을 수 있는 이익과 발각될 위험을 비교합니다. 합리적인 선택이 무엇인지 계산한 뒤 결정합니다.", scores: { naU: 0, midEum: 0, simJ: 1, yuJun: 0, yeRin: 0, yunJae: 1 } },
                    { text: "쉽게 결정하지 않고 상황을 지켜봅니다. 필요할 때 사용할 수 있도록 선택지를 남겨둡니다.", scores: { naU: 0, midEum: 0, simJ: 0, yuJun: 1, yeRin: 0, yunJae: 0 } }
                ]
            },
            {
                id: 3,
                text: "당신이 믿고 따르던 사람이 잘못된 선택을 했다는 것을 알게 되었습니다. 주변에서는 그 사실을 덮으려고 합니다. 당신은 어떻게 하시겠습니까?",
                options: [
                    { text: "사실을 확인하고, 알게 된 내용을 적절한 방식으로 알립니다. 침묵은 잘못을 키운다고 생각합니다.", scores: { naU: 1, midEum: 1, simJ: 0, yuJun: 0, yeRin: 0, yunJae: 0 } },
                    { text: "그 사람의 잘못이 아니라 시스템의 문제일 수 있습니다. 더 큰 구조의 문제를 함께 바라봅니다.", scores: { naU: 0, midEum: 1, simJ: 0, yuJun: 0, yeRin: 0, yunJae: 0 } },
                    { text: "이 사실이 나와의 관계와 앞으로의 위치에 어떤 영향을 줄지 생각합니다. 신중하게 행동 방식을 정합니다.", scores: { naU: 0, midEum: 0, simJ: 1, yuJun: 0, yeRin: 0, yunJae: 1 } },
                    { text: "상황이 어떻게 흘러가는지 지켜봅니다. 섣불리 나서지 않고, 때를 기다립니다.", scores: { naU: 0, midEum: 0, simJ: 0, yuJun: 1, yeRin: 0, yunJae: 0 } }
                ]
            },

        shareBtn.onclick = async () => {
            const name = document.getElementById('memberName').textContent;
            const text = `나의 ASCENDANT 캐릭터는 「${name}」입니다!\n어떤 사람인지 확인해보세요 ✨`;
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'ASCENDANT 캐릭터 테스트', text: text });
                } else {
                    await navigator.clipboard.writeText(text);
                    toast.textContent = '결과가 클립보드에 복사되었습니다!';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                }
            } catch (e) {
                try {
                    await navigator.clipboard.writeText(text);
                    toast.textContent = '결과가 클립보드에 복사되었습니다!';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                } catch (err) {
                    toast.textContent = '공유에 실패했습니다. 직접 복사해주세요.';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                }
            }
        };
    </script>
</body>
</html>
